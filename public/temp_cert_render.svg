
<svg width="600" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Warm aged parchment gradient -->
    <radialGradient id="parchment" cx="45%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#fffef7" />
      <stop offset="55%" stop-color="#f5ecda" />
      <stop offset="100%" stop-color="#ddcbab" />
    </radialGradient>
  </defs>

  <!-- Parchment paper -->
  <rect width="600" height="800" fill="url(#parchment)" />

  <!-- Borders -->
  <rect x="24" y="24" width="552" height="752" fill="none" stroke="#5a411e" stroke-width="4.5" />
  <rect x="34" y="34" width="532" height="732" fill="none" stroke="#997a48" stroke-width="1.5" stroke-dasharray="8,4" />

  <!-- University Emblem / Crest -->
  <g transform="translate(300, 110) scale(1.15)">
    <!-- Shield -->
    <path d="M -32,-32 L 32,-32 L 32,8 C 32,28 0,42 0,42 C 0,42 -32,28 -32,8 Z" fill="#1b2a47" stroke="#b8933b" stroke-width="2.5" />
    <!-- Crest bird / crane -->
    <path d="M -8,5 Q 0,-20 8,-22 Q 12,-10 6,10 Z" fill="#e8cf78" />
    <!-- Sun/Book on shield -->
    <path d="M -18,-15 Q 0,-22 18,-15 L 18,2 Q 0,-5 -18,2 Z" fill="#d4af37" />
    <!-- Motto ribbon -->
    <path d="M -40,42 Q 0,52 40,42 L 36,52 Q 0,62 -36,52 Z" fill="#c49b38" stroke="#5a4111" stroke-width="1" />
  </g>

  <!-- Typography -->
  <text x="300" y="195" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c2214" text-anchor="middle" letter-spacing="4">KAMPALA UNIVERSITY</text>
  <text x="300" y="220" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6d583b" text-anchor="middle" letter-spacing="2">WE BUILD FOR THE FUTURE</text>

  <line x1="160" y1="238" x2="440" y2="238" stroke="#997a48" stroke-width="1.2" />

  <text x="300" y="275" font-family="Georgia, serif" font-size="13" fill="#5c4a31" text-anchor="middle" letter-spacing="2">THIS IS TO CERTIFY THAT</text>

  <text x="300" y="325" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#141a24" text-anchor="middle" letter-spacing="2">ALEX SSEGUYA</text>
  <line x1="130" y1="340" x2="470" y2="340" stroke="#b8933b" stroke-width="1.5" />

  <text x="300" y="380" font-family="Georgia, serif" font-size="13" fill="#5c4a31" text-anchor="middle">HAS BEEN ADMITTED TO THE DEGREE OF</text>

  <text x="300" y="430" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#18273d" text-anchor="middle" letter-spacing="3">BACHELOR OF ARTS</text>

  <text x="300" y="470" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#4d3e29" text-anchor="middle" letter-spacing="1">SECOND CLASS HONOURS (UPPER DIVISION)</text>
  <text x="300" y="495" font-family="Georgia, serif" font-size="13" fill="#635137" text-anchor="middle">IN ECONOMICS &amp; STATISTICS</text>

  <!-- Red Wax Seal -->
  <g transform="translate(300, 600)">
    <circle cx="0" cy="0" r="50" fill="#751111" />
    <circle cx="0" cy="0" r="46" fill="#991b1b" />
    <circle cx="0" cy="0" r="41" fill="none" stroke="#d63f3f" stroke-width="1.5" stroke-dasharray="4,2" />
    <circle cx="0" cy="0" r="36" fill="#751111" />
    <path d="M -15,-14 L 15,-14 L 15,4 C 15,16 0,22 0,22 C 0,22 -15,16 -15,4 Z" fill="#550c0c" />
    <text x="0" y="3" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">OFFICIAL</text>
    <text x="0" y="15" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="#fca5a5" text-anchor="middle">SEAL</text>
    <!-- Highlight reflection -->
    <path d="M -28,-28 A 38 38 0 0 1 24,-30" stroke="#f87171" stroke-width="2.5" fill="none" opacity="0.7" />
  </g>

  <!-- Signatures -->
  <g transform="translate(130, 675)">
    <path d="M -40,-8 Q -20,-32 5,-12 Q 25,2 45,-18" fill="none" stroke="#1d263b" stroke-width="1.8" />
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#887355" stroke-width="1" />
    <text x="0" y="16" font-family="Georgia, serif" font-size="10" fill="#6d583b" text-anchor="middle">VICE CHANCELLOR</text>
  </g>

  <g transform="translate(470, 675)">
    <path d="M -45,-15 Q -15,-38 15,-10 Q 35,-28 45,-8" fill="none" stroke="#1d263b" stroke-width="1.8" />
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#887355" stroke-width="1" />
    <text x="0" y="16" font-family="Georgia, serif" font-size="10" fill="#6d583b" text-anchor="middle">ACADEMIC REGISTRAR</text>
  </g>
</svg>
