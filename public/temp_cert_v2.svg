
  <svg width="600" height="850" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="lighting" x1="20%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%" stop-color="#fff8eb" />
        <stop offset="40%" stop-color="#f5e6cb" />
        <stop offset="85%" stop-color="#dfcaa2" />
        <stop offset="100%" stop-color="#cca878" />
      </linearGradient>
      <radialGradient id="lampGlow" cx="40%" cy="0%" r="90%">
        <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.35" />
        <stop offset="60%" stop-color="#d97706" stop-opacity="0.1" />
        <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
      </radialGradient>
    </defs>

    <!-- Parchment base -->
    <rect width="600" height="850" fill="url(#lighting)" />
    <!-- Lamp lighting overlay -->
    <rect width="600" height="850" fill="url(#lampGlow)" />

    <!-- Ornate Double Border -->
    <rect x="26" y="26" width="548" height="798" fill="none" stroke="#4a3518" stroke-width="4.5" />
    <rect x="36" y="36" width="528" height="778" fill="none" stroke="#785929" stroke-width="1.5" stroke-dasharray="7,3" />

    <!-- Corner knots -->
    <circle cx="26" cy="26" r="6" fill="#4a3518" />
    <circle cx="574" cy="26" r="6" fill="#4a3518" />
    <circle cx="26" cy="824" r="6" fill="#4a3518" />
    <circle cx="574" cy="824" r="6" fill="#4a3518" />

    <!-- Crest / Coat of Arms -->
    <g transform="translate(300, 115) scale(1.1)">
      <path d="M -30,-30 L 30,-30 L 30,8 C 30,26 0,40 0,40 C 0,40 -30,26 -30,8 Z" fill="#1e293b" stroke="#b45309" stroke-width="2.5" />
      <!-- Crested Crane / Sun -->
      <path d="M -7,6 Q 0,-18 7,-20 Q 11,-8 5,10 Z" fill="#fbbf24" />
      <path d="M -16,-14 Q 0,-20 16,-14 L 16,1 Q 0,-5 -16,1 Z" fill="#d97706" />
      <path d="M -36,40 Q 0,48 36,40 L 32,49 Q 0,57 -32,49 Z" fill="#92400e" stroke="#451a03" stroke-width="1" />
    </g>

    <!-- Typography -->
    <text x="300" y="195" font-family="Georgia, serif" font-size="23" font-weight="bold" fill="#291c0e" text-anchor="middle" letter-spacing="4">KAMPALA UNIVERSITY</text>
    <text x="300" y="218" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5c4323" text-anchor="middle" letter-spacing="2">WE BUILD FOR THE FUTURE</text>

    <line x1="160" y1="234" x2="440" y2="234" stroke="#855d28" stroke-width="1.2" />

    <text x="300" y="270" font-family="Georgia, serif" font-size="13" fill="#4a3518" text-anchor="middle" letter-spacing="2">THIS IS TO CERTIFY THAT</text>

    <text x="300" y="318" font-family="Georgia, serif" font-size="31" font-weight="bold" fill="#111827" text-anchor="middle" letter-spacing="2">ALEX SSEGUYA</text>
    <line x1="120" y1="332" x2="480" y2="332" stroke="#b45309" stroke-width="1.8" />

    <text x="300" y="370" font-family="Georgia, serif" font-size="13" fill="#4a3518" text-anchor="middle">HAS BEEN ADMITTED TO THE DEGREE OF</text>

    <text x="300" y="420" font-family="Georgia, serif" font-size="33" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="3">BACHELOR OF ARTS</text>

    <text x="300" y="460" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#3b2b15" text-anchor="middle" letter-spacing="1">SECOND CLASS HONOURS (UPPER DIVISION)</text>
    <text x="300" y="485" font-family="Georgia, serif" font-size="13" fill="#4a3518" text-anchor="middle">IN ECONOMICS &amp; STATISTICS</text>

    <!-- Red Wax Seal with ribbon -->
    <g transform="translate(300, 600)">
      <!-- Red ribbon tail -->
      <path d="M -15,20 L -25,75 L 0,60 L 25,75 L 15,20 Z" fill="#7f1d1d" opacity="0.85" />
      <circle cx="0" cy="0" r="50" fill="#691111" />
      <circle cx="0" cy="0" r="46" fill="#881515" />
      <circle cx="0" cy="0" r="41" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2" />
      <circle cx="0" cy="0" r="36" fill="#691111" />
      <path d="M -14,-14 L 14,-14 L 14,4 C 14,15 0,21 0,21 C 0,21 -14,15 -14,4 Z" fill="#450a0a" />
      <text x="0" y="3" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">OFFICIAL</text>
      <text x="0" y="15" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="#fca5a5" text-anchor="middle">SEAL</text>
      <path d="M -26,-26 A 36 36 0 0 1 22,-28" stroke="#fca5a5" stroke-width="2.5" fill="none" opacity="0.75" />
    </g>

    <!-- Signatures -->
    <g transform="translate(130, 680)">
      <path d="M -40,-8 Q -20,-32 5,-12 Q 25,2 45,-18" fill="none" stroke="#0f172a" stroke-width="1.8" />
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#785929" stroke-width="1" />
      <text x="0" y="16" font-family="Georgia, serif" font-size="10" fill="#5c4323" text-anchor="middle">VICE CHANCELLOR</text>
    </g>

    <g transform="translate(470, 680)">
      <path d="M -45,-15 Q -15,-38 15,-10 Q 35,-28 45,-8" fill="none" stroke="#0f172a" stroke-width="1.8" />
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#785929" stroke-width="1" />
      <text x="0" y="16" font-family="Georgia, serif" font-size="10" fill="#5c4323" text-anchor="middle">ACADEMIC REGISTRAR</text>
    </g>
  </svg>
  