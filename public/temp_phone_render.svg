
<svg width="500" height="950" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b141b" />
      <stop offset="100%" stop-color="#080e13" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18232c" />
      <stop offset="100%" stop-color="#121b22" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="950" fill="url(#bg)" />

  <!-- Status Bar -->
  <g fill="#aebac1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="600">
    <text x="35" y="45">19:46</text>
    <g transform="translate(410, 30)">
      <!-- Battery icon -->
      <rect x="0" y="0" width="35" height="18" rx="4" fill="none" stroke="#aebac1" stroke-width="2" />
      <rect x="3" y="3" width="7" height="12" rx="2" fill="#ef4444" />
      <path d="M 36,6 L 38,6 L 38,12 L 36,12 Z" fill="#aebac1" />
    </g>
    <!-- Signal & 4G -->
    <text x="350" y="45" font-size="15">4G</text>
  </g>

  <!-- Top App Bar -->
  <rect y="70" width="500" height="90" fill="#1f2c34" />
  <!-- Avatar / Back -->
  <text x="25" y="125" font-size="32" fill="#00a884">&lt;</text>
  <circle cx="95" cy="115" r="28" fill="#ff7675" />
  <text x="95" y="124" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">M</text>
  <text x="140" y="112" font-family="-apple-system, sans-serif" font-size="26" font-weight="bold" fill="#e9edef">Mum</text>
  <text x="140" y="136" font-family="-apple-system, sans-serif" font-size="17" fill="#8696a0">online</text>

  <!-- Notification Banner from Brightpath Consulting -->
  <g transform="translate(25, 185)">
    <rect width="450" height="145" rx="16" fill="url(#cardGrad)" stroke="#00a884" stroke-width="1.5" />
    <circle cx="35" cy="40" r="15" fill="#00a884" />
    <text x="35" y="46" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">✓</text>
    <text x="65" y="42" font-family="-apple-system, sans-serif" font-size="19" font-weight="bold" fill="#00a884" letter-spacing="1">BRIGHTPATH CONSULTING</text>
    <text x="415" y="40" font-family="-apple-system, sans-serif" font-size="15" fill="#8696a0" text-anchor="end">7:46 PM</text>
    <text x="25" y="80" font-family="-apple-system, sans-serif" font-size="18" fill="#e9edef">“Your application has been shortlisted.”</text>
    <text x="25" y="110" font-family="-apple-system, sans-serif" font-size="16" fill="#8696a0">Interview tomorrow, 9 a.m., Ntinda.</text>
    <text x="25" y="132" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f59e0b">Transport needed: UGX 20,000</text>
  </g>

  <!-- MTN MoMo Balance Badge -->
  <g transform="translate(140, 360)">
    <rect width="220" height="42" rx="21" fill="#202c33" stroke="#f59e0b" stroke-width="1" />
    <circle cx="22" cy="21" r="9" fill="#f59e0b" />
    <text x="22" y="26" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">M</text>
    <text x="45" y="27" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#f59e0b">MoMo: UGX 2,300</text>
  </g>

  <!-- Previous Family Message -->
  <g transform="translate(35, 430)">
    <rect width="360" height="95" rx="14" fill="#202c33" />
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#25d366">Mum</text>
    <text x="20" y="60" font-family="-apple-system, sans-serif" font-size="18" fill="#e9edef">Alex, have you eaten anything?</text>
    <text x="330" y="82" font-family="-apple-system, sans-serif" font-size="14" fill="#8696a0">6:14 PM</text>
  </g>

  <!-- The Draft Message Input (THE CENTRAL MOMENT) -->
  <g transform="translate(25, 760)">
    <!-- Input Capsule -->
    <rect width="370" height="72" rx="36" fill="#2a3942" />
    <text x="30" y="44" font-family="-apple-system, sans-serif" font-size="22" fill="#e9edef">Mum, send me something small.</text>
    <!-- Blinking Cursor -->
    <line x1="340" y1="24" x2="340" y2="52" stroke="#00a884" stroke-width="3" />

    <!-- Green Send Button -->
    <g transform="translate(385, 0)">
      <circle cx="36" cy="36" r="36" fill="#00a884" />
      <!-- Paper Airplane Icon -->
      <path d="M 22,24 L 54,36 L 22,48 L 28,36 Z" fill="#ffffff" />
    </g>
  </g>

  <!-- Keyboard bottom hint -->
  <rect y="860" width="500" height="90" fill="#182229" />
  <g fill="#8696a0" font-family="-apple-system, sans-serif" font-size="18" text-anchor="middle">
    <text x="250" y="910">Press Send • Ask for Transport</text>
  </g>
</svg>
