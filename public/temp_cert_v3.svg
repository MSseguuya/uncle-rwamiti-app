
<svg width="1200" height="1700" viewBox="0 0 1200 1700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Parchment paper gradient with subtle warm center highlight -->
    <radialGradient id="paperGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fdfbf5"/>
      <stop offset="60%" stop-color="#f5eedc"/>
      <stop offset="100%" stop-color="#e3d6be"/>
    </radialGradient>

    <!-- Warm bedside lamp light wash from upper right -->
    <linearGradient id="lampWash" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeed0" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffd599" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2a1e12" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Gold foil metallic gradient for seal -->
    <radialGradient id="goldSeal" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe899"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#6b4c05"/>
    </radialGradient>

    <!-- Red wax seal gradient -->
    <radialGradient id="redWax" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#d12c2c"/>
      <stop offset="60%" stop-color="#8a1111"/>
      <stop offset="100%" stop-color="#4a0505"/>
    </radialGradient>

    <!-- Drop shadow for seals -->
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#3a2512" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Parchment Base -->
  <rect width="1200" height="1700" fill="url(#paperGlow)"/>

  <!-- Ornate Double Diploma Border -->
  <rect x="50" y="50" width="1100" height="1600" fill="none" stroke="#2b2318" stroke-width="4"/>
  <rect x="65" y="65" width="1070" height="1570" fill="none" stroke="#7a5d34" stroke-width="1.5" stroke-dasharray="8,4"/>
  <rect x="75" y="75" width="1050" height="1550" fill="none" stroke="#2b2318" stroke-width="1"/>

  <!-- Ornate Corner Embellishments -->
  <g fill="#2b2318">
    <!-- Top-Left -->
    <circle cx="50" cy="50" r="10"/>
    <path d="M 50,50 L 100,50 L 100,53 L 53,53 L 53,100 L 50,100 Z"/>
    <!-- Top-Right -->
    <circle cx="1150" cy="50" r="10"/>
    <path d="M 1150,50 L 1100,50 L 1100,53 L 1147,53 L 1147,100 L 1150,100 Z"/>
    <!-- Bottom-Left -->
    <circle cx="50" cy="1650" r="10"/>
    <path d="M 50,1650 L 100,1650 L 100,1647 L 53,1647 L 53,1600 L 50,1600 Z"/>
    <!-- Bottom-Right -->
    <circle cx="1150" cy="1650" r="10"/>
    <path d="M 1150,1650 L 1100,1650 L 1100,1647 L 1147,1647 L 1147,1600 L 1150,1600 Z"/>
  </g>

  <!-- University Coat of Arms / Crest -->
  <g transform="translate(600, 220)">
    <!-- Crest Shield -->
    <path d="M -70,-60 L 70,-60 L 70,10 C 70,60 0,95 0,95 C 0,95 -70,60 -70,10 Z" fill="#1b2e4b" stroke="#aa7c11" stroke-width="4"/>
    <!-- Gold sun / torch / book symbol inside crest -->
    <path d="M -35,-20 L 35,-20 L 25,25 C 20,45 0,60 0,60 C 0,60 -20,45 -25,25 Z" fill="#aa7c11"/>
    <!-- Open Book silhouette -->
    <path d="M -22,0 C -10,-5 0,-2 0,-2 C 0,-2 10,-5 22,0 L 20,18 C 10,14 0,16 0,16 C 0,16 -10,14 -20,18 Z" fill="#fdfbf5"/>
    <!-- Motto ribbon below crest -->
    <path d="M -120,115 L 120,115 L 100,135 L 120,155 L -120,155 L -100,135 Z" fill="#aa7c11"/>
    <text x="0" y="142" font-family="'Times New Roman', Times, serif" font-size="16" font-weight="bold" fill="#fdfbf5" text-anchor="middle" letter-spacing="3">WE BUILD FOR THE FUTURE</text>
  </g>

  <!-- Institution Header -->
  <text x="600" y="440" font-family="'Times New Roman', Times, serif" font-size="48" font-weight="bold" fill="#1b222d" text-anchor="middle" letter-spacing="6">MAKERERE UNIVERSITY</text>
  <text x="600" y="480" font-family="'Times New Roman', Times, serif" font-size="20" font-style="italic" fill="#5a4d3b" text-anchor="middle" letter-spacing="2">KAMPALA, UGANDA</text>

  <!-- Decorative Divider -->
  <path d="M 380,520 L 820,520" stroke="#aa7c11" stroke-width="2"/>
  <circle cx="600" cy="520" r="6" fill="#aa7c11"/>

  <!-- Preamble -->
  <text x="600" y="590" font-family="'Times New Roman', Times, serif" font-size="26" font-style="italic" fill="#3a3328" text-anchor="middle" letter-spacing="1.5">This is to certify that</text>

  <!-- Graduate Name -->
  <g transform="translate(600, 700)">
    <line x1="-360" y1="20" x2="360" y2="20" stroke="#7a5d34" stroke-width="1.5"/>
    <text x="0" y="0" font-family="'Times New Roman', Times, serif" font-size="56" font-weight="bold" fill="#111822" text-anchor="middle" letter-spacing="4">ALEX SSEGUYA</text>
  </g>

  <!-- Degree Conferral Statement -->
  <text x="600" y="800" font-family="'Times New Roman', Times, serif" font-size="25" fill="#443b2f" text-anchor="middle" letter-spacing="1">has satisfied all requirements and was admitted to the Degree of</text>

  <!-- DEGREE TITLE -->
  <g transform="translate(600, 910)">
    <text x="0" y="0" font-family="'Times New Roman', Times, serif" font-size="62" font-weight="bold" fill="#111b27" text-anchor="middle" letter-spacing="5">BACHELOR OF ARTS</text>
    <text x="0" y="55" font-family="'Times New Roman', Times, serif" font-size="30" font-weight="bold" fill="#7a2a18" text-anchor="middle" letter-spacing="2">SECOND CLASS HONOURS (UPPER DIVISION)</text>
    <text x="0" y="105" font-family="'Times New Roman', Times, serif" font-size="26" font-style="italic" fill="#332c22" text-anchor="middle" letter-spacing="1.5">in Economics &amp; Social Statistics</text>
  </g>

  <!-- Date & Senate Statement -->
  <text x="600" y="1130" font-family="'Times New Roman', Times, serif" font-size="22" fill="#554b3e" text-anchor="middle">Conferred by the Authority of the University Senate</text>
  <text x="600" y="1165" font-family="'Times New Roman', Times, serif" font-size="19" font-style="italic" fill="#665b4c" text-anchor="middle">Given under our hands and the Common Seal of the University</text>

  <!-- Wax Seal with Ribbons (Center-Bottom) -->
  <g transform="translate(600, 1340)" filter="url(#sealShadow)">
    <!-- Red Silk Ribbons -->
    <path d="M -30,40 L -50,150 L -20,135 L 0,150 L -10,40 Z" fill="#8a1111" opacity="0.9"/>
    <path d="M 10,40 L 0,150 L 20,135 L 50,150 L 30,40 Z" fill="#6e0b0b" opacity="0.9"/>
    <!-- Outer scalloped red wax -->
    <circle cx="0" cy="0" r="95" fill="url(#redWax)"/>
    <!-- Gold embossed inner ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#goldSeal)" stroke-width="5" stroke-dasharray="10,3"/>
    <!-- Inner gold medallion -->
    <circle cx="0" cy="0" r="62" fill="url(#goldSeal)"/>
    <circle cx="0" cy="0" r="54" fill="#8a1111"/>
    <!-- Official seal inscription -->
    <text x="0" y="-12" font-family="'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#ffd599" text-anchor="middle" letter-spacing="2">OFFICIAL</text>
    <text x="0" y="10" font-family="'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#ffd599" text-anchor="middle" letter-spacing="2">SEAL</text>
    <text x="0" y="28" font-family="'Times New Roman', Times, serif" font-size="11" fill="#ffe899" text-anchor="middle" letter-spacing="1">UGANDA</text>
  </g>

  <!-- Signatures Left & Right -->
  <g transform="translate(260, 1420)">
    <!-- Realistic ink signature 1 -->
    <path d="M -110,-20 C -70,-50 -50,10 -10,-30 C 15,-55 40,-10 70,-25 C 95,-35 110,-10 120,-15" fill="none" stroke="#141a29" stroke-width="3" stroke-linecap="round"/>
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#443c2f" stroke-width="1.5"/>
    <text x="0" y="28" font-family="'Times New Roman', Times, serif" font-size="20" font-weight="bold" fill="#2b2318" text-anchor="middle">VICE-CHANCELLOR</text>
  </g>

  <g transform="translate(940, 1420)">
    <!-- Realistic ink signature 2 -->
    <path d="M -120,-10 C -90,-40 -70,-5 -30,-45 C 10,-60 20,-15 60,-30 C 80,-40 100,-15 115,-20" fill="none" stroke="#141a29" stroke-width="3" stroke-linecap="round"/>
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#443c2f" stroke-width="1.5"/>
    <text x="0" y="28" font-family="'Times New Roman', Times, serif" font-size="20" font-weight="bold" fill="#2b2318" text-anchor="middle">ACADEMIC REGISTRAR</text>
  </g>

  <!-- Certificate Serial Number -->
  <text x="1110" y="1620" font-family="'Times New Roman', Times, serif" font-size="16" fill="#887965" text-anchor="end" letter-spacing="2">NO. MAK/BA/2022/04891</text>

  <!-- Natural Room Lighting Wash (Warm lamp glow from top-right) -->
  <rect width="1200" height="1700" fill="url(#lampWash)" style="mix-blend-mode: multiply; pointer-events: none;"/>
</svg>
